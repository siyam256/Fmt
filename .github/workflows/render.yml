name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Decide whether voiceover exists
        id: audio
        run: |
          if [ -f public/voiceover.mp3 ]; then
            echo 'props={"hasAudio":true}' >> "$GITHUB_OUTPUT"
            echo "Voiceover found: audio will be included."
          else
            echo 'props={"hasAudio":false}' >> "$GITHUB_OUTPUT"
            echo "No public/voiceover.mp3 — rendering without audio."
          fi

      - name: Render video
        run: >
          npx remotion render src/index.tsx SinCosIdentity out/video.mp4
          --codec=h264
          --props='${{ steps.audio.outputs.props }}'

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: sin-cos-identity-video
          path: out/video.mp4
          retention-days: 14

name: Render video

on:
  push:            # any branch, any file change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fonts (fallback for math symbols and Bengali)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core

      - name: Check narration audio exists
        run: |
          ls -la public || true
          if [ ! -f public/narration.mp3 ]; then
            echo "::error::public/narration.mp3 not found. Commit your audio to public/narration.mp3"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Render
        run: npm run render

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 14

name: Render video

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fonts (fallback for math symbols and Bengali)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core

      # Audio না থাকলে 244 সেকেন্ডের silent placeholder বানায়।
      # পরে public/narration.mp3 commit করলে আসল audio-ই ব্যবহার হবে।
      - name: Use silent placeholder if narration.mp3 is missing
        run: |
          mkdir -p public
          if [ -f public/narration.mp3 ]; then
            echo "Found public/narration.mp3, using it."
          else
            echo "No narration.mp3, generating silent placeholder."
            command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
            ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=mono -t 244 -q:a 9 public/narration.mp3
          fi

      - name: Install dependencies
        run: npm install

      - name: Render
        run: npm run render

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 14
